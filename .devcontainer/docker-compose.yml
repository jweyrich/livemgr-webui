services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules
    # Keep the container alive; the dev server is started from the terminal
    command: sleep infinity
    environment:
      LIVEMGR_KEYSERVER_HOST: keyserver
      LIVEMGR_KEYSERVER_CA_FILE: /workspace/conf/certs/ca.crt
    depends_on:
      - db
      - keyserver

  # Development stand-in for the livemgr KeyServer; its certificates are
  # created by tools/license/provision.sh (see initializeCommand)
  keyserver:
    image: python:3.12-alpine
    restart: unless-stopped
    volumes:
      - ../tools/keyserver:/opt/keyserver:ro
      - ../conf/keyserver:/etc/keyserver:ro
    command: python /opt/keyserver/keyserver.py --cert /etc/keyserver/keyserver.pem --ca-file /etc/keyserver/ca.crt

  # Django 5.1 requires MariaDB 10.5 or later. 10.11 is the oldest release
  # still supported upstream (until February 2028).
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      # Upgrades the system tables of a db_data volume an older release created
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - db_data:/var/lib/mysql
      # Runs create_schema.sql then create_tables.sql on first start only
      - ../bootstrap/db:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
  node_modules:
